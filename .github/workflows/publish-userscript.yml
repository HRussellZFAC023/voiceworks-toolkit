name: Build & Publish Userscript

on:
  release:
    types: [published]

  # Allow manual trigger from Actions tab
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: asmr-one-ultimate/package-lock.json

      - name: Install dependencies
        working-directory: asmr-one-ultimate
        run: npm ci

      - name: Run tests
        working-directory: asmr-one-ultimate
        run: npm run test:run

      - name: Type-check
        working-directory: asmr-one-ultimate
        run: npm run typecheck

      - name: Build userscript
        working-directory: asmr-one-ultimate
        run: npm run build

      - name: Install Playwright Chromium
        working-directory: asmr-one-ultimate
        run: npx playwright install --with-deps chromium

      - name: Run browser integration tests
        working-directory: asmr-one-ultimate
        env:
          E2E_PROXY: 1
        run: npm run test:e2e

      - name: Read version
        id: version
        working-directory: asmr-one-ultimate
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Verify release tag matches package version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: test "$RELEASE_TAG" = "v$PACKAGE_VERSION"

      - name: Download published release asset
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/published-release"
          gh release download "${{ github.event.release.tag_name }}" \
            --pattern asmr-one-ultimate.user.js \
            --dir "$RUNNER_TEMP/published-release"

      - name: Verify published asset matches CI build
        if: github.event_name == 'release'
        run: |
          test -f "$RUNNER_TEMP/published-release/asmr-one-ultimate.user.js"
          test "$(sha256sum asmr-one-ultimate/dist/asmr-one-ultimate.user.js | cut -d' ' -f1)" = \
            "$(sha256sum "$RUNNER_TEMP/published-release/asmr-one-ultimate.user.js" | cut -d' ' -f1)"

      - name: Upload manual build artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: asmr-one-ultimate-${{ steps.version.outputs.version }}
          path: asmr-one-ultimate/dist/asmr-one-ultimate.user.js
          if-no-files-found: error

      - name: Summary
        run: |
          echo "### Userscript Build Verified" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version**: ${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tag**: ${{ github.event.release.tag_name || 'manual' }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "- **Result**: Published release asset matches the CI build byte-for-byte." >> "$GITHUB_STEP_SUMMARY"
            echo "- **Download**: \`https://github.com/${{ github.repository }}/releases/latest/download/asmr-one-ultimate.user.js\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **Result**: Manual build is available as a workflow artifact." >> "$GITHUB_STEP_SUMMARY"
          fi
